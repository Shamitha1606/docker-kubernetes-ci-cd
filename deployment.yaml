apiVersion: apps/v1
kind: Deployment
metadata:
name: docker-cicd-app
spec:
replicas: 2
selector:
matchLabels:
app: docker-cicd-app
template:
metadata:
labels:
app: docker-cicd-app
spec:
containers:
- name: web-container
image: shamitha2006/docker-kubernetes-cicd:latest
imagePullPolicy: Always
ports:
- containerPort: 80
readinessProbe:
httpGet:
path: /
port: 80
initialDelaySeconds: 5
periodSeconds: 5
